; 随发布包分发 —— **没有这个文件，双击 keycount.exe 会是黑方块**。
;
; 实测（2026-10-09，官方 4.7.2 模板导出的包）：
;   包里 project.godot 写的是 renderer/rendering_method="gl_compatibility"，
;   但导出版启动时引擎仍起 Forward+/Vulkan：
;       Vulkan 1.3.289 - Forward+ - Using Device #0: NVIDIA ...
;   而 Vulkan 下透明窗口会渲染成**纯黑方块**（四角像素实测：挪窗前后 82.5% 不同、挪前平均亮度 0）。
;   加上本文件后同一台机器变成：
;       OpenGL API 3.3.0 NVIDIA 566.36 - Compatibility
;   四角实测：挪窗前后 0% 不同、平均亮度 42.1 ⇒ 透明正常。
;
; 结论：**不要只依赖包里的工程设置**。start.cmd/start.ps1 另外还显式传了
; --rendering-driver opengl3（双保险，与开发期 agent-test/run-pet.ps1 的做法一致）。
[rendering]

renderer/rendering_method="gl_compatibility"

; 版本号：发布流程会把下面这行替换成真 tag（方案 F：v0.1.日期）。
; 为什么放这里：实测（2026-10-09）导出版**读不到 pck 里 project.godot 的自定义键**，
; 而本文件（exe 旁边）能生效 —— 与上面渲染器那条是同一个结论。
; 它会被宠物写进 run.log 与库里的 run_log.version（数据溯源）。
[keycount]

version="dev"
