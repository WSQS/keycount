# 编译 + 出包：**每次 push 都产出一个可下载的 zip**（artifact），tag 时由 release.yml 复用。
#
# 为什么两个 target 都要编：2026-10-09 踩过一个坑 —— `template_release.dll` 旧了
# （比源码旧），拿它做的 release 导出版里扩展**静默不加载**（一条报错都没有）。
# 干净检出 + 两个 target 都编，这类问题在 CI 里不可能发生。详见 SPEC.md「导出（release）」。
#
# 产物（artifact）：keycount-windows-x64-<version>.zip
#   keycount.exe / keycount.windows.template_release.x86_64.dll
#   start.cmd / start.ps1（启动器：把键盘焦点还给原来的窗口）/ README.txt
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  # 与 gdext/GODOT_CPP_PIN.txt 一致；下面的步骤会断言 checkout 到的 SHA
  GODOT_CPP_PIN: 507ed9d840c01a3c5b2a39af8bb4000bfac30bf5
  # Windows 上 Python 的 stdout 默认 cp1252，脚本里打印中文会 UnicodeEncodeError（实测炸过一次）
  PYTHONUTF8: "1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # godot-cpp 编译产物很贵（1091 个编译单元），按 PIN 缓存；源码也在里面。
      # .sconsign.dblite 必须一起缓存：没有它 scons 无法判定目标是最新的，会全量重编
      # （实测：只缓存 godot-cpp 目录时，日志里仍有 **2194 行 Compiling**，等于没缓存）
      - uses: actions/cache@v4
        with:
          path: |
            gdext/godot-cpp
            gdext/.sconsign.dblite
          key: godot-cpp-${{ env.GODOT_CPP_PIN }}-${{ runner.os }}
      # Godot 编辑器 + 导出模板（只取 windows 成员，约 300MB）
      - uses: actions/cache@v4
        with:
          path: |
            .ci/godot
            .ci/templates
          key: godot-${{ env.GODOT_VERSION }}-${{ runner.os }}

      - name: 取 godot-cpp（按 PIN，并断言 SHA）
        shell: bash
        run: |
          set -euo pipefail
          pin=$(awk '/^commit/{print $2}' gdext/GODOT_CPP_PIN.txt)
          [ "$pin" = "$GODOT_CPP_PIN" ] || { echo "PIN 文件与 workflow 里的值不一致：$pin"; exit 1; }
          if [ ! -d gdext/godot-cpp/.git ]; then
            # 完整克隆（35MB）：不玩 --filter/单提交 fetch，少两种失败模式
            git clone --quiet https://github.com/godotengine/godot-cpp gdext/godot-cpp
          fi
          git -C gdext/godot-cpp fetch --quiet --tags origin 2>/dev/null || true
          git -C gdext/godot-cpp checkout --force "$pin"
          got=$(git -C gdext/godot-cpp rev-parse HEAD)
          [ "$got" = "$pin" ] || { echo "godot-cpp SHA 与 PIN 不符：$got != $pin"; exit 1; }
          echo "godot-cpp @ $got"

      - name: Godot 编辑器（缓存里没有就下）
        shell: bash
        run: |
          set -euo pipefail
          exe=".ci/godot/Godot_v${GODOT_VERSION}-stable_win64.exe"
          if [ ! -f "$exe" ]; then
            mkdir -p .ci/godot
            curl -sSL -o .ci/godot/editor.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_win64.exe.zip"
            python -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" \
              .ci/godot/editor.zip .ci/godot
            rm -f .ci/godot/editor.zip
          fi
          "$exe" --version

      - name: 导出模板（缓存里没有就下；只取 windows 成员）
        shell: bash
        run: |
          set -euo pipefail
          dir=".ci/templates/${GODOT_VERSION}.stable"
          if [ ! -f "$dir/windows_release_x86_64.exe" ]; then
            python tools/ci/fetch_export_templates.py --version "$GODOT_VERSION" --dest .ci/templates
          fi
          # Godot 只认 %APPDATA%\Godot\export_templates\<版本串>\ —— 拷过去。
          # 注意 bash 侧要用 cygpath 转成 /c/... 这种 MSYS 路径，$APPDATA 本身是 C:\... 形式
          dest="$(cygpath -u "$APPDATA")/Godot/export_templates"
          mkdir -p "$dest"
          cp -r .ci/templates/* "$dest/"
          ls "$dest/${GODOT_VERSION}.stable/" | head -5

      - name: dump extension_api.json（gdext 构建的输入）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gdext/api
          ./.ci/godot/Godot_v${GODOT_VERSION}-stable_win64_console.exe --headless --dump-extension-api
          mv extension_api.json gdext/api/extension_api.json
          wc -c gdext/api/extension_api.json

      - name: 项目能被 Godot 解析（project.godot 写坏要在这里红）
        shell: bash
        run: |
          set -euo pipefail
          # 实测踩过：project.godot 的注释里出现等号 ⇒ Godot 报
          # "Error parsing ...: Expected value, got 'ERROR'"，整个项目加载不了，
          # 而导出本身却可能“看起来成功” ⇒ 所以单独断言一下。
          godot=./.ci/godot/Godot_v${GODOT_VERSION}-stable_win64_console.exe
          out=$("$godot" --headless --quit-after 10 --path pet 2>&1 || true)
          if printf '%s' "$out" | grep -q 'Error parsing'; then
            printf '%s\n' "$out" | grep -A2 'Error parsing' | sed 's/^/     /'
            echo "project.godot 解析失败（注释里不能有等号）"; exit 1
          fi
          echo "project.godot 解析正常"

      - name: 文字排版口径单测（headless，不需要真实桌面）
        shell: bash
        run: |
          set -euo pipefail
          # 回归对象：数字一变长，英文字母就跑到圆外（原来用固定 180px 盒子 + 固定字号）。
          # 这是纯函数口径（pet/text_fit.gd），所以能 headless 跑、能进 CI。
          godot=./.ci/godot/Godot_v${GODOT_VERSION}-stable_win64_console.exe
          "$godot" --headless --path pet --script test_text_fit.gd

      - name: 编扩展（debug + release）
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet scons
          # pip 装到 user-site 时 Scripts 不一定在 PATH 上，显式补一下
          export PATH="$PATH:$(python -c 'import site,os;print(os.path.join(site.USER_BASE,"Scripts"))')"
          command -v scons
          cd gdext
          scons platform=windows target=template_debug   api_version=4.7 -j"$NUMBER_OF_PROCESSORS"
          scons platform=windows target=template_release api_version=4.7 -j"$NUMBER_OF_PROCESSORS"
          ls -la bin/

      - name: 把 dll 放到工程里，做过导入，导出 release
        shell: bash
        run: |
          set -euo pipefail
          # ---- 版本号注入（方案 F：v0.1.YYYYMMDD，PATCH = 日期）----
          # 唯一事实源是 git tag；push 到 main 的构建**不是发布**，用 sha-<7>（不占版本号）
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            VERSION="$GITHUB_REF_NAME"
            mmdd=$(printf '%s' "$VERSION" | grep -oE '[0-9]{8}$' | cut -c5-8 || true)
          else
            VERSION="sha-${GITHUB_SHA::7}"
          fi
          [ -n "${mmdd:-}" ] || mmdd=$(date +%m%d)
          # Windows 的 FileVersion 是 4 个 16 位数（≤65535），装不下 20261009 ⇒ 映射成 MMDD
          FILEVER="0.1.${mmdd}.0"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # 用 [keycount] 段里的 version（不是 application/config/version：实测那个键读出来是空串）
          sed -i "s|^version=.*|version=\"$VERSION\"|" pet/project.godot
          sed -i "s|^application/product_version=.*|application/product_version=\"$VERSION\"|;s|^application/file_version=.*|application/file_version=\"$FILEVER\"|" pet/export_presets.cfg
          echo "注入版本: keycount/version=$VERSION  file_version=$FILEVER"
          grep -n '^version=' pet/project.godot
          # 注意：pet/addons/keycount/bin/ 是 gitignore 的（dll 是构建产物），干净检出里**不存在**
          mkdir -p pet/addons/keycount/bin
          cp gdext/bin/*.dll pet/addons/keycount/bin/
          godot=./.ci/godot/Godot_v${GODOT_VERSION}-stable_win64_console.exe
          # 过一遍导入：没有 .godot/extension_list.cfg 时扩展不会被登记
          "$godot" --headless --editor --quit --path pet >/dev/null 2>&1 || echo "（导入有非零退出，继续）"
          mkdir -p dist
          # 导出目标必须是 **Windows 路径**：Git Bash 的 $(pwd) 是 /d/a/...，原生 Godot 不认
          out=$(python -c "import os;print(os.path.abspath('dist/keycount.exe'))")
          "$godot" --headless --path pet --export-release "Windows Desktop" "$out"
          # 断言版本真的进了包（project.binary 里是明文字符串）：注入失败要在这里红，而不是静默出个 dev 包
          grep -aq "$VERSION" dist/keycount.exe || { echo "exe 里找不到版本串 '$VERSION' —— 注入没生效"; exit 1; }
          echo "已确认 exe 内嵌 project.binary 带着版本串：$VERSION"
          ls -la dist/

      - name: 组装发布包（+ sha256）
        id: pkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # 版本号由上一个步骤注入（tag→v0.1.YYYYMMDD / push→sha-xxxxxxx），这里只管打包
          $version = $env:VERSION
          if (-not $version) { throw "VERSION 环境变量为空（版本注入那步没跑？）" }
          # artifact 名不能直接用 ${{ github.ref_name }}：在 PR 上它是 "1/merge"（refs/pull/1/merge 的短名），
          # 带斜杠 ⇒ upload-artifact 报 "The artifact name is not valid"（实测踩过：PR 上 build 必红）。
          # 所以在这里洗干净、并通过 step output 传出去（GITHUB_ENV 的变量进不了 `${{ env }}` 上下文）。
          $safe = ($version -replace '[^A-Za-z0-9._-]', '-') + "-$(($env:GITHUB_SHA).Substring(0,7))"
          "artifact=keycount-windows-x64-$safe" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          Copy-Item packaging/start.cmd, packaging/start.ps1, packaging/README.txt, packaging/override.cfg dist/
          # 版本号也写进 override.cfg：实测导出版**读不到 pck 里的自定义键**，只认 exe 旁边的这个文件。
          # （渲染器那次同一条结论；所以“导出版要用的配置”都放这里）
          (Get-Content dist/override.cfg -Raw).Replace('version="dev"', "version=`"$version`"") |
            Set-Content dist/override.cfg -NoNewline
          if (-not (Select-String -Path dist/override.cfg -Pattern ([regex]::Escape($version)) -Quiet)) {
            throw "override.cfg 里没写上版本号 $version"
          }
          (Get-Content dist/README.txt -Raw).Replace("__VERSION__", $version) | Set-Content dist/README.txt -NoNewline
          # 透明那一条必须人工看：CI 断言不了（实测踩过：包里的渲染器设置不生效 ⇒ 黑方块）
          if (-not (Test-Path dist/override.cfg)) { throw "dist/ 里没有 override.cfg —— 双击 exe 会变黑方块" }
          $zip = "keycount-windows-x64-$version.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Set-Content "$zip.sha256"
          Get-Content "$zip.sha256"
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          # 用上一步算好的安全名字（见那条注释：github.ref_name 在 PR 上是 "1/merge"，带斜杠会报错）
          name: ${{ steps.pkg.outputs.artifact }}
          path: |
            keycount-windows-x64-*.zip
            keycount-windows-x64-*.zip.sha256
          if-no-files-found: error
